<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拾光日历 | Pure Aesthetic</title>
    <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.12.0/dist/av-min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-main: #f2f2f7; --card-bg: #ffffff;
            --text-title: #1d1d1f; --text-sub: #86868b;
            --accent: #0071e3;
            /* 状态色：水彩清透系 */
            --st-green: #d1fae5; --st-green-txt: #065f46;
            --st-blue: #dbeafe; --st-blue-txt: #1e40af;
            --st-red: #fee2e2; --st-red-txt: #991b1b;
        }

        body { 
            margin: 0; font-family: -apple-system, "SF Pro SC", "SF Pro Display", "PingFang SC", sans-serif; 
            background: var(--bg-main); color: var(--text-title); -webkit-font-smoothing: antialiased;
        }

        /* 状态类名 */
        .mark-green { background: var(--st-green) !important; color: var(--st-green-txt) !important; }
        .mark-blue { background: var(--st-blue) !important; color: var(--st-blue-txt) !important; }
        .mark-red { background: var(--st-red) !important; color: var(--st-red-txt) !important; }

        /* 呼吸感导航 */
        .header {
            height: 60px; background: rgba(255, 255, 255, 0.7); backdrop-filter: saturate(180%) blur(20px);
            display: flex; justify-content: center; gap: 40px; align-items: center;
            position: sticky; top: 0; z-index: 100; border-bottom: 0.5px solid rgba(0,0,0,0.1);
        }
        .header-btn {
            font-size: 0.95rem; border: none; background: none; color: var(--text-sub);
            padding: 6px 16px; cursor: pointer; border-radius: 10px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .header-btn.active { color: var(--accent); background: rgba(0, 113, 227, 0.1); font-weight: 600; }

        .container { width: 94%; max-width: 800px; margin: 24px auto; }

        /* 月视图：极简细线 */
        .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
        .day-cell {
            background: var(--card-bg); border-radius: 14px; padding: 10px; min-height: 105px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); cursor: pointer; transition: 0.3s;
            display: flex; flex-direction: column; border: 0.5px solid rgba(0,0,0,0.05);
        }
        .day-cell:active { transform: scale(0.96); opacity: 0.8; }
        .day-cell.today { border: 2px solid var(--accent); }
        .cell-num { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; color: var(--text-sub); }
        .cell-summary { font-size: 0.75rem; line-height: 1.4; opacity: 0.8; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }

        /* 周视图：纯净卡片流 */
        .week-list { display: flex; flex-direction: column; gap: 14px; }
        .week-card {
            background: var(--card-bg); border-radius: 18px; padding: 18px;
            display: flex; align-items: center; gap: 18px; border: 0.5px solid rgba(0,0,0,0.05);
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); cursor: pointer;
        }
        .week-date-box { 
            min-width: 55px; height: 55px; background: var(--bg-main); 
            border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .week-date-num { font-size: 1.3rem; font-weight: 700; }
        .week-date-day { font-size: 0.7rem; font-weight: 500; opacity: 0.6; }

        /* 编辑视图 */
        .editor-card { background: var(--card-bg); border-radius: 24px; padding: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.06); }
        .task-item { display: flex; align-items: center; padding: 15px 0; border-bottom: 0.5px solid #f2f2f7; }
        .task-idx { color: var(--text-sub); width: 35px; font-size: 0.9rem; font-weight: 500; }
        .task-input { flex: 1; border: none; outline: none; font-size: 1rem; color: var(--text-title); background: transparent; }
        .task-check { 
            width: 22px; height: 22px; border: 1.5px solid #d2d2d7; border-radius: 6px;
            cursor: pointer; transition: 0.2s; margin-left: 10px; display: flex; align-items: center; justify-content: center;
        }
        .task-check.done { background: var(--accent); border-color: var(--accent); }
        .task-check.done::after { content: '✓'; color: white; font-size: 14px; font-weight: bold; }
        .task-input.completed { text-decoration: line-through; color: var(--text-sub); opacity: 0.5; }

        /* 奶油感标签按钮 */
        .tag-row { display: flex; gap: 10px; margin-top: 30px; }
        .tag-btn { 
            flex: 1; padding: 12px; border-radius: 12px; border: none; 
            text-align: center; font-size: 0.9rem; cursor: pointer; transition: 0.3s;
            background: #f2f2f7; color: var(--text-sub); font-weight: 500;
        }
        .tag-btn.active[data-tag="green"] { background: var(--st-green); color: var(--st-green-txt); }
        .tag-btn.active[data-tag="blue"] { background: var(--st-blue); color: var(--st-blue-txt); }
        .tag-btn.active[data-tag="red"] { background: var(--st-red); color: var(--st-red-txt); }

        .save-btn {
            width: 100%; padding: 16px; background: var(--text-title); color: white;
            border: none; border-radius: 14px; font-size: 1rem; font-weight: 600;
            margin-top: 32px; cursor: pointer; transition: opacity 0.3s;
        }
        .save-btn:active { opacity: 0.8; }

        .sync-status { text-align: center; font-size: 0.75rem; color: var(--text-sub); margin-top: 24px; }

        @media (max-width: 768px) {
            .container { width: 92%; }
            .day-cell { min-height: 90px; }
        }
    </style>
</head>
<body>

    <nav class="header">
        <button class="header-btn active" id="btn-home" onclick="navTo('home')">首页</button>
        <button class="header-btn" id="btn-today" onclick="navTo('editor')">今日任务</button>
    </nav>

    <div class="container">
        <div id="view-home">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h2 id="time-title" style="margin:0; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px;"></h2>
                <div style="display: flex; gap: 5px; background: #e5e5ea; padding: 3px; border-radius: 9px;">
                    <button id="m-toggle" onclick="setMode('month')" style="border:none; padding:6px 12px; border-radius:7px; font-size:0.75rem; cursor:pointer; font-weight:600;">月历</button>
                    <button id="w-toggle" onclick="setMode('week')" style="border:none; padding:6px 12px; border-radius:7px; font-size:0.75rem; cursor:pointer; font-weight:600;">周历</button>
                </div>
            </div>
            <div id="home-content"></div>
            <div class="sync-status" id="sync-info">☁️ 同步就绪</div>
        </div>

        <div id="view-editor" style="display: none;">
            <div class="editor-card">
                <div onclick="navTo('home')" style="color:var(--accent); font-size:0.9rem; font-weight:500; cursor:pointer; margin-bottom:24px;">← 返回</div>
                <h3 id="edit-date" style="margin: 0 0 24px 0; text-align: center; font-size: 1.5rem; font-weight: 700;"></h3>
                <div id="task-box"></div>
                <div onclick="addItem()" style="text-align:center; color:var(--accent); font-size:2.5rem; cursor:pointer; line-height:1; margin-top:10px;">+</div>
                
                <div style="margin-top: 24px;">
                    <textarea id="edit-sum" style="width:100%; border:none; background:var(--bg-main); border-radius:14px; padding:18px; outline:none; box-sizing:border-box; font-size:1rem; color:var(--text-title); line-height:1.5;" placeholder="写下今日的一句话总结..."></textarea>
                </div>
                
                <div class="tag-row">
                    <div class="tag-btn" data-tag="green" onclick="setTag('green')">充实</div>
                    <div class="tag-btn" data-tag="blue" onclick="setTag('blue')">平稳</div>
                    <div class="tag-btn" data-tag="red" onclick="setTag('red')">低迷</div>
                </div>
                <button class="save-btn" onclick="handleSave()">保存</button>
            </div>
        </div>
    </div>

<script>
    // --- 配置保持一致 ---
    AV.init({
        appId: "bcAx6bqlbWuUW6pVaBwRyRWU-gzGzoHsz",
        appKey: "cmzEQp0JhWvP7qNLd90hHKW2",
        serverURL: "https://bcax6bql.lc-cn-n1-shared.com"
    });

    let db = JSON.parse(localStorage.getItem('TS_DATA_V11')) || {};
    let anchor = new Date();
    let editKey = "";
    let activeTag = "";
    let snapshot = "";
    let mode = window.innerWidth < 768 ? 'week' : 'month';

    window.onload = () => {
        setMode(mode);
        pull();
        Sortable.create(document.getElementById('task-box'), { animation: 150, onEnd: reindex });
    };

    async function pull() {
        try {
            const q = new AV.Query('CalendarLog').equalTo('user_id', 'default_user');
            const res = await q.first();
            if(res) {
                db = JSON.parse(res.get('content'));
                localStorage.setItem('TS_DATA_V11', JSON.stringify(db));
                refresh();
                document.getElementById('sync-info').innerText = "✨ 云端同步完成";
            }
        } catch(e) { document.getElementById('sync-info').innerText = "🌙 本地编辑模式"; }
    }

    async function push() {
        try {
            const q = new AV.Query('CalendarLog').equalTo('user_id', 'default_user');
            let log = await q.first() || new (AV.Object.extend('CalendarLog'))({user_id: 'default_user'});
            log.set('content', JSON.stringify(db));
            await log.save();
        } catch(e) { console.error("Cloud push failed"); }
    }

    function setMode(m) {
        mode = m;
        document.getElementById('m-toggle').style.background = m === 'month' ? '#fff' : 'transparent';
        document.getElementById('m-toggle').style.boxShadow = m === 'month' ? '0 2px 8px rgba(0,0,0,0.1)' : 'none';
        document.getElementById('w-toggle').style.background = m === 'week' ? '#fff' : 'transparent';
        document.getElementById('w-toggle').style.boxShadow = m === 'week' ? '0 2px 8px rgba(0,0,0,0.1)' : 'none';
        refresh();
    }

    function refresh() {
        const container = document.getElementById('home-content'); container.innerHTML = "";
        const now = new Date(); now.setHours(0,0,0,0);

        if(mode === 'month') {
            document.getElementById('time-title').innerText = `${anchor.getFullYear()}年${anchor.getMonth()+1}月`;
            container.className = "month-grid";
            let first = (new Date(anchor.getFullYear(), anchor.getMonth(), 1).getDay() || 7) - 1;
            for(let i=0; i<first; i++) container.appendChild(document.createElement('div'));
            for(let d=1; d<=new Date(anchor.getFullYear(), anchor.getMonth()+1, 0).getDate(); d++) {
                container.appendChild(buildCell(new Date(anchor.getFullYear(), anchor.getMonth(), d), now));
            }
        } else {
            document.getElementById('time-title').innerText = "本周记录";
            container.className = "week-list";
            let start = new Date(anchor); start.setDate(start.getDate() - (start.getDay() || 7) + 1);
            for(let i=0; i<7; i++) {
                let d = new Date(start); d.setDate(start.getDate() + i);
                container.appendChild(buildWeekCard(d, now));
            }
        }
    }

    function buildCell(d, now) {
        const key = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
        const data = db[key] || {};
        const el = document.createElement('div');
        el.className = `day-cell ${d.getTime()===now.getTime()?'today':''} ${data.tag ? 'mark-'+data.tag : ''}`;
        el.innerHTML = `<div class="cell-num">${d.getDate()}</div><div class="cell-summary">${data.summary||''}</div>`;
        el.onclick = () => open(key);
        return el;
    }

    function buildWeekCard(d, now) {
        const key = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
        const data = db[key] || {};
        const el = document.createElement('div');
        el.className = `week-card ${data.tag ? 'mark-'+data.tag : ''}`;
        if(d.getTime()===now.getTime()) el.style.borderColor = "var(--accent)";
        const week = ['日','一','二','三','四','五','六'][d.getDay()];
        el.innerHTML = `
            <div class="week-date-box" style="${data.tag ? 'background:rgba(255,255,255,0.4)':''}">
                <div class="week-date-num">${d.getDate()}</div>
                <div class="week-date-day">周${week}</div>
            </div>
            <div style="flex:1">
                <div style="font-size:1.05rem;font-weight:600;">${data.summary || '今日小记...'}</div>
                <div style="font-size:0.8rem;opacity:0.6;margin-top:2px;">完成 ${ (data.tasks||[]).filter(t=>t.done).length } / ${ (data.tasks||[]).length }</div>
            </div>
        `;
        el.onclick = () => open(key);
        return el;
    }

    function open(key) {
        editKey = key;
        const data = db[key] || {tasks:[], summary:"", tag:""};
        document.getElementById('edit-date').innerText = key.replace(/-/g, ' . ');
        const box = document.getElementById('task-box'); box.innerHTML = "";
        (data.tasks.length ? data.tasks : [{text:"", done:false}]).forEach(t => addItem(t));
        document.getElementById('edit-sum').value = data.summary || "";
        setTag(data.tag || "");
        snapshot = getEditorStr();
        navTo('editor');
    }

    function addItem(t = {text:"", done:false}) {
        const div = document.createElement('div');
        div.className = "task-item";
        div.innerHTML = `
            <div class="task-idx">01</div>
            <input type="text" class="task-input ${t.done?'completed':''}" value="${t.text}" placeholder="添加任务...">
            <div class="task-check ${t.done?'done':''}" onclick="this.classList.toggle('done'); this.previousElementSibling.classList.toggle('completed');"></div>
            <div onclick="this.parentElement.remove();reindex();" style="color:#ff3b30;margin-left:12px;cursor:pointer;font-size:1rem;opacity:0.3;">✕</div>
        `;
        document.getElementById('task-box').appendChild(div);
        reindex();
    }

    function reindex() {
        document.querySelectorAll('.task-idx').forEach((el, i) => el.innerText = String(i+1).padStart(2,'0'));
    }

    function setTag(t) {
        activeTag = t;
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.toggle('active', b.dataset.tag === t));
    }

    function getEditorStr() {
        const ts = Array.from(document.querySelectorAll('.task-item')).map(el => ({
            text: el.querySelector('.task-input').value,
            done: el.querySelector('.task-check').classList.contains('done')
        })).filter(t => t.text.trim());
        return JSON.stringify({ts, sum: document.getElementById('edit-sum').value.trim(), tag: activeTag});
    }

    async function handleSave() {
        const s = JSON.parse(getEditorStr());
        db[editKey] = {tasks: s.ts, summary: s.sum, tag: s.tag};
        localStorage.setItem('TS_DATA_V11', JSON.stringify(db));
        snapshot = getEditorStr();
        document.getElementById('sync-info').innerText = "☁️ 正在保存...";
        navTo('home');
        push();
    }

    function navTo(t) {
        if(t === 'home' && document.getElementById('view-editor').style.display === 'block') {
            if(getEditorStr() !== snapshot && !confirm("尚未保存，确定离开？")) return;
        }
        document.getElementById('view-home').style.display = t === 'home' ? 'block' : 'none';
        document.getElementById('view-editor').style.display = t === 'editor' ? 'block' : 'none';
        document.getElementById('btn-home').className = `header-btn ${t==='home'?'active':''}`;
        document.getElementById('btn-today').className = `header-btn ${t==='editor'?'active':''}`;
        if(t === 'home') refresh();
        else if(t === 'editor' && editKey === "") open(`${new Date().getFullYear()}-${new Date().getMonth()+1}-${new Date().getDate()}`);
    }
</script>
</body>
</html>
