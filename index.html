<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>拾光日历 | 云端同步版</title>
    <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.12.0/dist/av-min.js"></script>
    <style>
        :root {
            --primary: #5c7cfa;
            --st-green: #a8dab5; 
            --st-blue: #a1c4fd;  
            --st-red: #f9b2b2;   
            --bg-base: #f0f2f5;
            --text-main: #374151;
            --text-muted: #9ca3af;
            --white: #ffffff;
            --danger: #ff6b6b;
        }

        body { 
            margin: 0; font-family: 'PingFang SC', sans-serif;
            background: var(--bg-base); color: var(--text-main);
            min-height: 100vh; display: flex; flex-direction: column;
        }

        /* 顶部导航 */
        .navbar {
            height: 70px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px);
            display: flex; justify-content: center; gap: 20px; align-items: center;
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #e5e7eb;
        }
        .nav-btn {
            font-size: 0.9rem; color: #6b7280; cursor: pointer; transition: 0.3s;
            padding: 8px 16px; border-radius: 50px; border: none; background: transparent;
        }
        .nav-btn.active { color: var(--primary); background: var(--white); box-shadow: 0 4px 6px rgba(0,0,0,0.05); font-weight: 600; }

        .container { width: 95%; max-width: 1000px; margin: 20px auto; flex: 1; }

        /* 月历视图 */
        .cal-card { background: var(--white); border-radius: 24px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }

        .day-cell {
            aspect-ratio: 1/1.2; border-radius: 12px; padding: 8px; transition: 0.2s;
            cursor: pointer; display: flex; flex-direction: column; background: #f9fafb; border: 1px solid transparent; overflow: hidden;
        }
        .day-cell.is-today { border-color: var(--primary); background: #fff; }
        .day-cell.mark-green { background: #e6f4ea; border-bottom: 4px solid var(--st-green); }
        .day-cell.mark-blue { background: #e8f0fe; border-bottom: 4px solid var(--st-blue); }
        .day-cell.mark-red { background: #fce8e8; border-bottom: 4px solid var(--st-red); }

        .cell-num { font-size: 0.9rem; font-weight: 500; color: #9ca3af; }
        .cell-summary { font-size: 0.7rem; color: #4b5563; font-style: italic; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; line-height: 1.3; margin-top: 2px; }

        /* 同步按钮样式 */
        .sync-info { text-align: center; margin-top: 15px; font-size: 0.75rem; color: var(--text-muted); }
        .btn-sync { color: var(--primary); cursor: pointer; font-weight: bold; text-decoration: underline; }

        /* 编辑视图 */
        .editor-card { background: var(--white); border-radius: 24px; padding: 25px; box-shadow: 0 20px 25px rgba(0,0,0,0.1); position: relative; }
        .back-link { font-size: 0.85rem; color: var(--text-muted); cursor: pointer; margin-bottom: 20px; display: inline-block; }

        /* 事项清单 */
        .task-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
        .task-no { font-family: monospace; width: 30px; color: var(--primary); font-weight: bold; }
        .task-input { flex: 1; border: none; outline: none; background: transparent; font-size: 1rem; }
        .del-btn { color: #d1d5db; cursor: pointer; padding: 0 10px; }

        .add-btn { text-align: center; color: var(--text-muted); cursor: pointer; font-size: 1.5rem; margin: 15px 0; }

        /* 评价标签 */
        .tag-group { display: flex; gap: 10px; margin-top: 10px; }
        .tag-pill { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #e5e7eb; text-align: center; font-size: 0.85rem; cursor: pointer; }
        .tag-pill.active[data-tag="green"] { background: var(--st-green); color: #fff; }
        .tag-pill.active[data-tag="blue"] { background: var(--st-blue); color: #fff; }
        .tag-pill.active[data-tag="red"] { background: var(--st-red); color: #fff; }

        .save-btn { width: 100%; padding: 15px; background: var(--text-main); color: #fff; border: none; border-radius: 50px; margin-top: 30px; font-weight: bold; cursor: pointer; }
        
        /* 导入导出隐藏 */
        .hidden-tools { display: flex; justify-content: center; gap: 20px; margin-top: 20px; opacity: 0.5; font-size: 0.7rem; }
    </style>
</head>
<body onbeforeunload="return checkDirty(event)">

    <nav class="navbar">
        <button class="nav-btn active" id="nav-home" onclick="handleNav('home')">首页月历</button>
        <button class="nav-btn" id="nav-today" onclick="handleNav('editor')">当日任务</button>
    </nav>

    <div class="container">
        <div id="view-home">
            <div class="cal-card">
                <div class="cal-header">
                    <button onclick="moveMonth(-1)" style="border:none;background:none;">⇠</button>
                    <h2 id="month-label" style="font-size: 1.2rem;">2025 . 12</h2>
                    <button onclick="moveMonth(1)" style="border:none;background:none;">⇢</button>
                </div>
                <div class="grid" id="main-grid"></div>
                <div class="sync-info">
                    数据已加密存储。 <span class="btn-sync" onclick="pullFromCloud()">🔄 点击拉取云端同步</span>
                </div>
            </div>
            <div class="hidden-tools">
                <span onclick="exportData()">导出JSON</span>
                <label>导入JSON<input type="file" style="display:none" onchange="importData(event)"></label>
            </div>
        </div>

        <div id="view-editor" style="display:none">
            <div class="editor-card">
                <span class="back-link" onclick="handleNav('home')">← 返回首页</span>
                <h2 id="edit-date-title" style="text-align:center; color:var(--primary);">12.27</h2>
                
                <div id="task-container" oninput="markDirty()"></div>
                <div class="add-btn" onclick="renderTaskItem({}); markDirty();">+</div>
                
                <div style="background:#f9fafb; padding:15px; border-radius:15px; margin-top:20px;">
                    <span style="font-size:0.8rem; color:var(--text-muted);">一句话总结</span>
                    <input type="text" id="inp-sum" oninput="markDirty()" style="width:100%; border:none; outline:none; background:transparent; font-size:1rem; font-style:italic;" placeholder="此刻心情...">
                </div>

                <div style="background:#f9fafb; padding:15px; border-radius:15px; margin-top:20px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:0.8rem; color:var(--text-muted);">今日评价</span>
                        <span style="font-size:0.7rem; color:var(--danger);" onclick="selectTag(''); markDirty();">清除</span>
                    </div>
                    <div class="tag-group">
                        <div class="tag-pill" data-tag="green" onclick="selectTag('green'); markDirty();">🌿 充实</div>
                        <div class="tag-pill" data-tag="blue" onclick="selectTag('blue'); markDirty();">💧 平稳</div>
                        <div class="tag-pill" data-tag="red" onclick="selectTag('red'); markDirty();">🍂 低迷</div>
                    </div>
                </div>
                <button class="save-btn" id="save-btn-text" onclick="saveData()">发布并同步至云端</button>
            </div>
        </div>
    </div>

<script>
    // ================= 配置区域 =================
    const STORAGE_KEY = 'TIME_STATION_CLOUD_V1';
    
    // 请在此处填入你的 LeanCloud 信息
    AV.init({
        appId: "bcAx6bqlbWuUW6pVaBwRyRWU-gzGzoHsz",
        appKey: "cmzEQp0JhWvP7qNLd90hHKW2",
        serverURL: "https://bcax6bql.lc-cn-n1-shared.com"
    });
    // ============================================

    const CalendarLog = AV.Object.extend('CalendarLog');
    const USER_ID = 'default_user'; // 个人使用固定即可

    let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    let currentMonth = new Date();
    let editingKey = "";
    let activeTag = "";
    let isDirty = false;

    // --- 云端同步逻辑 ---
    async function pushToCloud(data) {
        document.getElementById('save-btn-text').innerText = "同步中...";
        try {
            const query = new AV.Query('CalendarLog');
            query.equalTo('user_id', USER_ID);
            let log = await query.first();
            if (!log) log = new CalendarLog();
            log.set('user_id', USER_ID);
            log.set('content', JSON.stringify(data));
            await log.save();
            document.getElementById('save-btn-text').innerText = "记下今日拾光";
        } catch (e) {
            alert("云端备份失败，已存本地: " + e.message);
            document.getElementById('save-btn-text').innerText = "记下今日拾光";
        }
    }

    async function pullFromCloud() {
        try {
            const query = new AV.Query('CalendarLog');
            query.equalTo('user_id', USER_ID);
            const result = await query.first();
            if (result) {
                db = JSON.parse(result.get('content'));
                localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
                renderCalendar();
                alert("云端数据已成功拉取！");
            } else {
                alert("云端暂无存档。");
            }
        } catch (e) {
            alert("拉取失败: " + e.message);
        }
    }

    // --- 核心交互逻辑 ---
    function markDirty() { isDirty = true; }
    function checkDirty(e) { if (isDirty) { e.preventDefault(); e.returnValue = ''; } }

    function handleNav(target) {
        if (isDirty && !confirm("未保存的内容将丢失，确定离开？")) return;
        isDirty = false;
        if (target === 'home') switchView('home');
        else {
            const n = new Date();
            openEditor(`${n.getFullYear()}-${n.getMonth()+1}-${n.getDate()}`);
        }
    }

    function switchView(v) {
        document.getElementById('view-home').style.display = v === 'home' ? 'block' : 'none';
        document.getElementById('view-editor').style.display = v === 'editor' ? 'block' : 'none';
        document.getElementById('nav-home').classList.toggle('active', v === 'home');
        document.getElementById('nav-today').classList.toggle('active', v === 'editor');
        if(v === 'home') renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('main-grid'); grid.innerHTML = "";
        const y = currentMonth.getFullYear(), m = currentMonth.getMonth();
        document.getElementById('month-label').innerText = `${y} . ${String(m+1).padStart(2,'0')}`;
        let firstDay = new Date(y, m, 1).getDay();
        firstDay = (firstDay === 0) ? 6 : firstDay - 1; 
        const days = new Date(y, m + 1, 0).getDate();
        const now = new Date(); now.setHours(0,0,0,0);

        for(let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));
        for(let d = 1; d <= days; d++) {
            const key = `${y}-${m+1}-${d}`;
            const target = new Date(y, m, d);
            const data = db[key] || {};
            const cell = document.createElement('div');
            cell.className = `day-cell ${target.getTime()===now.getTime()?'is-today':''} ${data.tag?'mark-'+data.tag:''}`;
            cell.onclick = () => { if(isDirty && !confirm("先保存当前修改吗？")) return; openEditor(key); };
            cell.innerHTML = `<div class="cell-num">${d}</div><div class="cell-summary">${(target < now && !data.manual) ? "唐诗待选" : (data.summary || "")}</div>`;
            grid.appendChild(cell);
        }
    }

    function openEditor(key) {
        editingKey = key; isDirty = false;
        const data = db[key] || { tasks: [], summary: "", tag: "" };
        document.getElementById('edit-date-title').innerText = key.split('-').slice(1).join('.');
        const container = document.getElementById('task-container'); container.innerHTML = "";
        const tasks = data.tasks.length > 0 ? data.tasks : [{},{},{},{}];
        tasks.forEach(t => renderTaskItem(t));
        document.getElementById('inp-sum').value = data.manual ? data.summary : "";
        selectTag(data.tag);
        switchView('editor');
    }

    function renderTaskItem(t) {
        const wrap = document.createElement('div');
        wrap.className = 'task-row';
        wrap.innerHTML = `<span class="task-no">00</span><input type="text" class="task-input" value="${t.text||''}" placeholder="事项..."><span class="del-btn" onclick="this.parentElement.remove();updateIndices();markDirty();">✕</span>`;
        document.getElementById('task-container').appendChild(wrap);
        updateIndices();
    }

    function updateIndices() { document.querySelectorAll('.task-no').forEach((el, i) => el.innerText = String(i + 1).padStart(2, '0')); }
    function selectTag(type) { activeTag = type; document.querySelectorAll('.tag-pill').forEach(p => p.classList.toggle('active', p.dataset.tag === type)); }

    async function saveData() {
        const tasks = Array.from(document.querySelectorAll('.task-row')).map(r => ({ text: r.querySelector('.task-input').value })).filter(t => t.text.trim() !== "");
        const manualText = document.getElementById('inp-sum').value.trim();
        db[editingKey] = { tasks, summary: manualText, manual: !!manualText, tag: activeTag };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        isDirty = false;
        await pushToCloud(db); // 保存时自动推送到云端
        switchView('home');
    }

    // JSON 备份备用
    function exportData() {
        const blob = new Blob([JSON.stringify(db)], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `calendar_backup.json`; a.click();
    }
    function importData(e) {
        const reader = new FileReader();
        reader.onload = (ev) => { db = JSON.parse(ev.target.result); localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); renderCalendar(); alert('导入成功'); };
        reader.readAsText(e.target.files[0]);
    }

    function moveMonth(s) { currentMonth.setMonth(currentMonth.getMonth() + s); renderCalendar(); }
    
    // 初始化时自动拉取一次云端
    window.onload = () => {
        renderCalendar();
        setTimeout(pullFromCloud, 1000); 
    };
</script>
</body>
</html>
